name: Independently receive published original File against signed Code issuer

on:
  pull_request:
    paths:
      - ".github/workflows/original-published-file-compatibility.yml"
      - "test/published-file-original-code-compatibility.mjs"
      - "scripts/execute-javascript-node-command.mjs"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/original-published-file-compatibility.yml"
      - "test/published-file-original-code-compatibility.mjs"
      - "scripts/execute-javascript-node-command.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-original-file-published-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-published-file-and-code-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Receive original published Code source without private File checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Original Code Node 24 Linux receiving
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - name: Reconstruct previously source-qualified exact Code package and verify Sigstore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authentic-code"
          archive=$(npm pack --ignore-scripts --silent \
            --pack-destination "$RUNNER_TEMP/authentic-code")
          test "$archive" = "red-cup-engineering-execute-javascript-node-command-service-0.4.1-dev.0.tgz"
          cd "$RUNNER_TEMP/authentic-code"
          printf '%s  %s\n' \
            d2b969c4a2fd0fbfbfdc95685f85ed51638ccc18ea116011c8b4fb046f91308d \
            "$archive" | sha256sum --check --strict
          gh attestation verify "$archive" \
            --repo red-cup-engineering/execute-javascript-node-command-service \
            --signer-workflow red-cup-engineering/execute-javascript-node-command-service/.github/workflows/original-code-native-receiving.yml \
            --source-digest 09b5cb7e450e2df759e892fbb8ff725d8708d1d4 \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/code-verified-provenance.json"
          node --input-type=module - "$archive" "$RUNNER_TEMP/code-verified-provenance.json" <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const [, , archive, file]=process.argv;
          const digest=createHash('sha256').update(readFileSync(archive)).digest('hex');
          const statements=JSON.parse(readFileSync(file,'utf8'));
          assert.ok(statements.some(row=>
            row?.verificationResult?.statement?.predicateType==='https://slsa.dev/provenance/v1' &&
            row?.verificationResult?.statement?.subject?.some(s=>s.digest?.sha256===digest)));
          NODE
          echo "$archive" > CODE_ARCHIVE
          echo "Authenticated exact original Code source candidate; no private File source was copied"
      - name: Independently install real published File 0.8.4 and source-authenticated Code archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installed-published-file-and-code"
          cd "$RUNNER_TEMP/installed-published-file-and-code"
          npm init --yes --silent >/dev/null
          archive=$(cat "$RUNNER_TEMP/authentic-code/CODE_ARCHIVE")
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock \
            "$RUNNER_TEMP/authentic-code/$archive" \
            @red-cup-engineering/computer-file-engineering-services-section@0.8.4 \
            --registry=https://registry.561.group/
          cp "$GITHUB_WORKSPACE/test/published-file-original-code-compatibility.mjs" \
            published-original-file-consumer.test.mjs
          node --test --test-reporter=spec published-original-file-consumer.test.mjs
          echo "Observed real published original File plus authenticated Code consumer; File0.8.5/CDE remain unreceived"
